# TCP (L4) EGRESS load balancer for consumer -> broker connections, with dynamic
# service discovery AND true balancing.
#
#   * `resolver 127.0.0.11`  — Docker's embedded DNS. Compose returns every
#     replica of the `broker` service as an A record.
#   * `server broker:8765 resolve` + `zone` — nginx (OSS 1.27+) re-resolves the
#     name on an interval and keeps the upstream membership in sync with
#     `--scale broker=N`, adding/removing backends live.
#   * `least_conn` — real load balancing across the live replica set (not the
#     dumb per-connection round-robin you get from a bare variable proxy_pass).
#
# EGRESS model: ingest is REPLICATED (producers broadcast to every broker), so
# every broker holds the full stream. That makes an egress LB valid — a consumer
# pinned to any single broker still sees every message — and this is exactly the
# fan-out scaling axis: `least_conn` shards Z consumers across Y brokers, each
# broker serving ~Z/Y. On broker loss the reconnect re-homes to a survivor.
#
# (Producers do NOT flow through here — they broadcast directly to all brokers
# via DNS discovery. Contrast ../ingress_balanced_harness, where nginx fronts the
# producers and consumers fan in.)

worker_processes auto;
events { worker_connections 4096; }

stream {
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream brokers {
        zone brokers 64k;
        least_conn;
        server broker:8765 resolve max_fails=3 fail_timeout=5s;
    }

    server {
        listen 8765;
        proxy_pass brokers;
        proxy_connect_timeout 5s;
        proxy_timeout 1h;          # long-lived streams; don't reap idle subs
        proxy_socket_keepalive on;
    }
}
