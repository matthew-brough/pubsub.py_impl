[project]
name = "pubsub-egress-balanced-harness"
version = "0.1.0"
description = "Egress-balanced multi-broker pubsub.py harness: broadcasting producers (replicated ingest), nginx-LB sharded consumers, shared Postgres durability + audit trail, single observation platform."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pubsub-py[otel,fast]",
    "asyncpg>=0.30",
    "msgpack>=1.0",
    "fastapi>=0.115",
    "opentelemetry-exporter-prometheus>=0.48b0",
    "opentelemetry-sdk>=1.27",
    "uvicorn[standard]>=0.30",
]

# perf/sync-fanout is merged into master, so track master directly.
[tool.uv.sources]
pubsub-py = { git = "https://github.com/matthew-brough/pubsub.py.git", branch = "master" }
